    <p>一、中国制造业采购经理指数运行情况</p>
    <p>6月份，制造业采购经理指数（PMI）为<span>50.3</span>%，比上月上升0.3个百分点，重返扩张区间。</p>
    <p>大型企业PMI为50.7%，中型企业PMI为50.5%，小型企业PMI为48.2%。</p>
    <p>非制造业商务活动指数为50.2%，综合PMI产出指数为50.6%。</p>
