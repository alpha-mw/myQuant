name: Factor Governance Quality Gate

on:
  pull_request:
  workflow_dispatch:

jobs:
  factor-governance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Run unified Factor governance tests
        shell: bash
        run: |
          shopt -s nullglob
          unified_factor_tests=(tests/unit/test_unified_factor_*.py)
          if (( ${#unified_factor_tests[@]} == 0 )); then
            echo "No unified Factor tests found."
            exit 1
          fi
          uv run python -m pytest "${unified_factor_tests[@]}" -q

      - name: Run unified Factor governance mypy
        run: |
          uv run python -m mypy \
            quant_investor/factors/governance \
            --ignore-missing-imports
