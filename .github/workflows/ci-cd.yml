name: Quant-Investor CI/CD

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 19 * * *"
  workflow_dispatch:

jobs:
  engine-core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --locked --extra dev

    - name: Verify Codex deployment projection
      run: uv run python operations/codex/verify_projection.py

    - name: Check requirements and stable system contracts
      run: |
        uv run python scripts/check_requirements_sync.py
        uv run quant-investor system verify

    - name: Check strategy-record access governance
      run: uv run python scripts/check_strategy_record_access.py

    - name: Lint with flake8
      run: |
        uv run flake8 quant_investor --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 quant_investor --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics
        uv run flake8 quant_investor/contracts quant_investor/system \
          quant_investor/factors/governance quant_investor/intelligence \
          quant_investor/mainline quant_investor/cli \
          --max-complexity=10 --max-line-length=100
        uv run black --check quant_investor/contracts quant_investor/system \
          quant_investor/factors/governance quant_investor/intelligence \
          quant_investor/mainline quant_investor/cli

    - name: Type check with mypy
      run: |
        uv run mypy quant_investor/contracts quant_investor/system \
          quant_investor/factors/governance quant_investor/intelligence \
          quant_investor/mainline quant_investor/cli --ignore-missing-imports

    - name: Test unified stable contracts
      run: uv run pytest tests/unit -q -ra -k unified

    - name: Test engine core
      run: |
        uv run pytest tests/unit -q -ra

    - name: Check dashboard contract
      run: |
        node portfolio_dashboard/tests/cn_aggressive_dashboard_contract_v1.test.js
        node --check portfolio_dashboard/app.js
        node --check portfolio_dashboard/js/cn_aggressive_input.js
        node --check portfolio_dashboard/js/cn_aggressive_dashboard_contract_v1.js

  nightly-full-tests:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: uv sync --locked --extra dev

    - name: Run full test suite with coverage
      run: |
        uv run pytest tests/ \
          --cov=quant_investor \
          --cov-report=term-missing \
          --cov-report=html:results/htmlcov \
          --cov-report=xml:results/coverage.xml

    - name: Upload coverage artifact
      uses: actions/upload-artifact@v4
      with:
        name: nightly-coverage
        path: |
          results/htmlcov
          results/coverage.xml

  build:
    needs: ["engine-core"]
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install build dependencies
      run: uv sync --locked --extra dev

    - name: Build package
      run: uv build

    - name: Check package
      run: uv run twine check dist/*

  model-training:
    needs: ["engine-core"]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install dependencies
      run: |
        uv sync --locked --extra dev

    - name: Run model training
      env:
        TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
      run: |
        echo "运行模型训练..."
        # python scripts/unified/train_models.py --schedule

    - name: Upload model artifacts
      uses: actions/upload-artifact@v4
      with:
        name: trained-models
        path: models/
