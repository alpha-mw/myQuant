[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-investor"
version = "17.0.0"
description = "V17 v4 single-mainline research runtime with fail-closed active-pointer routing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Quant Team", email = "quant@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
# The factor-governance AST identity protocol pins ast.parse(optimize=...) and
# ast.dump(show_empty=True) as hashed contract terms, and both are 3.13+ only.
# Earlier interpreters raise TypeError, so 3.13 is the true floor.
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.0.0",
    "pyarrow>=24.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "TA-Lib>=0.4.28",
    "tushare>=1.2.89",
    "yfinance>=0.2.18",
    "fredapi>=0.5.0",
    "requests>=2.31.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "aiohttp>=3.8.0",
    "tqdm>=4.65.0",
    "python-dateutil>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.5.0",
]
backtest = [
    "backtrader>=1.9.78",
]

[project.urls]
Homepage = "https://github.com/alpha-mw/myQuant"
Repository = "https://github.com/alpha-mw/myQuant"

[project.scripts]
quant-investor = "quant_investor.cli.main:main"
quant-investor-v17-v4 = "quant_investor.intelligence.evaluator.cli:main"

[tool.black]
line-length = 100
target-version = ['py313']

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
follow_imports = "skip"
ignore_missing_imports = true
strict_optional = false
disable_error_code = ["import-untyped", "no-any-return", "no-untyped-def", "var-annotated"]
exclude = [
    '^quant_investor/data/',
    '^quant_investor/data_manager\.py$',
    '^quant_investor/market/download.*\.py$',
    '^quant_investor/fetch_.*\.py$',
    '^quant_investor/alpha.*\.py$',
    '^quant_investor/stock_database\.py$',
    '^quant_investor/macro_terminal_tushare\.py$',
]

[[tool.mypy.overrides]]
module = ["quant_investor.factors.*"]
strict_optional = true

# Byte-pinned by FIXED_EXISTING_PROJECT_SHA256 in
# quant_investor/factors/governance_prior_diagnostic_nomination_v4_3.py.
# The source cannot change without a governance re-pin, so the one remaining
# annotation defect is suppressed here rather than in the file itself.
[[tool.mypy.overrides]]
module = ["quant_investor.factors.governance_aquant_no_label_eval_v4_1"]
disable_error_code = ["type-var"]

[[tool.mypy.overrides]]
module = [
    "quant_investor.factors",
    "quant_investor.factors.aquant_expression",
    "quant_investor.factors.correlation",
    "quant_investor.factors.expression",
    "quant_investor.factors.health",
    "quant_investor.factors.library",
    "quant_investor.factors.operators",
    "quant_investor.factors.pit_fundamentals",
    "quant_investor.factors.shadow_scoring",
]
strict_optional = false
disable_error_code = ["arg-type", "assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["quant_investor"]
omit = ["*/tests/*", "*/venv/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.hatch.build]
skip-excluded-dirs = true
exclude = [
    "/.uv-cache",
    "/.uv-python",
    "/.venv",
    "/.venv-managed",
    "/venv",
    "/**/__pycache__",
    "/**/*.pyc",
    "/**/.DS_Store",
]

[tool.hatch.build.targets.sdist]
include = [
    "/quant_investor",
    "/README.md",
    "/pyproject.toml",
    "/requirements.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["quant_investor"]
