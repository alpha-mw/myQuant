        - paragraph [ref=e33]
        - paragraph [ref=e34]: 现将北京证券交易所2026年部分节假日休市安排有关事项公告如下：
        - paragraph [ref=e35]: 一、休市安排
        - paragraph [ref=e36]:
          - text: （一）元旦：1月
          - generic [ref=e37]: "1"
          - text: 日（星期四）至1月3日（星期六）休市。1月4日（星期日）为周末休市。1月5日（星期一）起照常开市。
        - paragraph [ref=e38]: （二）春节：2月15日（星期日）至2月23日（星期一）休市，2月14日（星期六）、2月28日（星期六）为周末休市。2月24日（星期二）起照常开市。
        - paragraph [ref=e39]: （三）清明节：4月4日（星期六）至4月6日（星期一）休市。4月7日（星期二）起照常开市。
        - paragraph [ref=e40]: （四）劳动节：5月1日（星期五）至5月5日（星期二）休市，5月9日（星期六）为周末休市。5月6日（星期三）起照常开市。
        - paragraph [ref=e41]: （五）端午节：6月19日（星期五）至6月21日（星期日）休市。6月22日（星期一）起照常开市。
        - paragraph [ref=e42]: （六）中秋节：9月25日（星期五）至9月27日（星期日）休市。9月28日（星期一）起照常开市。
        - paragraph [ref=e43]: （七）国庆节：10月1日（星期四）至10月7日（星期三）休市，9月20日（星期日）、10月10日（星期六）为周末休市。10月8日（星期四）起照常开市。
        - paragraph [ref=e44]: 二、有关清算事宜，根据中国证券登记结算有限责任公司的安排进行
        - paragraph [ref=e45]: 请各市场参与人据此安排好有关工作。
        - paragraph [ref=e46]: 特此公告。
