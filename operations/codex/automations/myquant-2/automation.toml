prompt = "使用 [$myquant](/Users/maxwell/.codex/skills/myquant/SKILL.md) 在 /Users/maxwell/mySpace/myQuant 对统一稳定 runtime 执行因子周度健康复核。\n\n任务目标：回答当前 admitted factor set 的证据是否仍健康、稳健、可解释并对投资决策有增量价值；及时识别数据、成熟度、统计、拥挤、成本、容量、冗余和 runtime identity 问题。健康复核是投资研究支撑，不是 factor admission/apply、active-generation CAS、主线发布/激活、股票候选、组合、订单或交易任务。\n\n开始前读取当前 AGENTS.md、.agent/CONTINUITY.md（若存在）、已安装 myquant skill 及 operations reference、docs/factor_governance.md 和 docs/migrations/unified-cutover/README.md。记录 branch、HEAD、dirty 状态和 import origin，保护无关改动；不得切换分支或执行 Git 发布。只使用单一 quant-investor 入口；禁止已移除的 secondary executable 与 commands、dynamic-import fallback 或 latest 扫描。market download 仅作为仓库明确保留的兼容 alias，与本任务无关。\n\n一、稳定系统与数据前提\n- 先检查当前 help，再运行 quant-investor system verify、quant-investor system status 和 quant-investor factor status 所需的 exact、显式参数。任何缺失 package、contract、generation、path、SHA、identity 或 cutoff 都必须 fail closed。\n- 只使用 schema-valid、hash-bound、strict CN Parquet full-A/PIT/cutoff/coverage 输入，并运行 quant-investor market storage-validate --market CN。禁止 CSV、stale、mock、cached、inferred 或 latest-by-mtime fallback。数据缺口路由给 maintenance lane，本任务不补数、不调用 provider。\n- 读取 evidence 前验证 exact path、regular-file、owner、mode、canonical bytes、schema 和 SHA；统一 _active.json、bound immutable generation objects、market/PIT/Fundamental pointers 与 factor-set identity 必须相容。统一 cutover 静态检查也必须通过，任何退役 factor-state surface 都要阻断健康复核。\n\n二、只读健康与证据检查\n- 使用 quant-investor factor status 读取 admitted set、factor/family identity、weights、maturity、statistics、runtime contract、fresh health、cost/capacity、turnover、drawdown 和 blockers。状态命令不得写统一 _active.json、generation object 或任何 pointer。\n- 用 quant-investor research readiness 与 quant-investor research inspect 做只读前瞻证据核对；不得运行 research forward、research evaluate 或 research compile-evidence 来补齐本周缺失证据。\n- 分别评估经济机制与方向、净 IC/RankIC、稳定性、purged/embargoed OOS、multiple-testing control、相对现有 set/family 的增量贡献、相关性、冗余、拥挤、衰减、成本、容量、换手和回撤。\n- 严格区分 factor idea、bootstrap definition、preregistration、prospective observation、admitted factor、factor health、股票候选和组合持仓。historical、diagnostic 或 incomplete prospective evidence 不能补齐 admitted set。data_blocked 不自动判定 alpha 失效，但必须阻断 healthy/readiness claim。\n\n三、保护与输出\n运行前后记录统一 _active.json、其绑定的 immutable generation objects、独立 market/PIT/Fundamental pointers、Strategy Record Store pointer 和 portfolio ledger 的 exact bytes/SHA，必须一致；统一 cutover 静态检查也必须通过。不得累计或应用 factor action；只运行最小 unified focused tests 和 git diff --check。\n\n最终先给投资研究结论，再给治理细节：\n1. 本周哪些 admitted factors 仍健康、退化、data_blocked 或证据不足；\n2. 它们对收益来源、回撤、换手、容量、行业/风格暴露和组合使用的含义；\n3. exact system/factor status 与 evidence path+SHA；\n4. exact status_id、active state/lane/route、observed state、readiness、blockers、activation_mutation_authorized，以及 factor/family/maturity/statistics/runtime evidence 明细；\n5. 建议保持、降权观察、暂停新增风险或进一步研究的 proposal；不得自动应用；\n6. protected bytes、cutover static-audit result、write-set、tests 和 skipped。\n\n明确 active_generation_write=false、mainline_publish=false、mainline_activate=false、new_risk_authorized=false。无候选名单、无自动决策状态映射、无组合或 ledger mutation、无 provider 补数、无 broker、无订单、无交易。"
